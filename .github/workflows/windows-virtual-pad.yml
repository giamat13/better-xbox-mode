name: Windows virtual controller

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  virtual-controller:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ViGEmBus virtual bus driver
        run: choco install vigembus -y --no-progress
      - name: Check driver service
        shell: cmd
        run: sc query ViGEmBus
      - name: Fetch vgamepad source
        # The sdist ships ViGEmClient.dll. Its setup.py re-runs the driver MSI during the build and hangs
        # on the runner, so the source is used directly from PYTHONPATH instead of being installed.
        shell: pwsh
        run: |
          $meta = Invoke-RestMethod https://pypi.org/pypi/vgamepad/0.1.0/json
          $url = ($meta.urls | Where-Object packagetype -eq 'sdist').url
          Invoke-WebRequest -Uri $url -OutFile vgamepad.tar.gz
          tar -xzf vgamepad.tar.gz
          Get-ChildItem vgamepad-0.1.0 -Recurse -Filter ViGEmClient.dll | ForEach-Object { $_.FullName }
      - name: Install project dependencies
        timeout-minutes: 8
        run: python -m pip install -r requirements.txt
      - name: Run virtual controller tests
        timeout-minutes: 8
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/vgamepad-0.1.0
        run: python -m unittest tests.test_virtual_controller -v
