name: Windows virtual controller

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  virtual-controller:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch vgamepad source
        # The sdist bundles ViGEmClient.dll and the ViGEmBus 1.17.333 installer that vgamepad 0.1.0 is built for.
        # Its setup.py installs the driver during the build and hangs on the runner, so the source is used
        # directly from PYTHONPATH instead of being installed.
        shell: pwsh
        run: |
          $meta = Invoke-RestMethod https://pypi.org/pypi/vgamepad/0.1.0/json
          $url = ($meta.urls | Where-Object packagetype -eq 'sdist').url
          Invoke-WebRequest -Uri $url -OutFile vgamepad.tar.gz
          tar -xzf vgamepad.tar.gz
      - name: Install ViGEmBus 1.17.333 driver (matching vgamepad)
        shell: pwsh
        run: |
          $msi = Join-Path $PWD 'vgamepad-0.1.0\vgamepad\win\vigem\install\x64\ViGEmBusSetup_x64.msi'
          $proc = Start-Process msiexec -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          Write-Output "msiexec exit code: $($proc.ExitCode)"
          sc.exe query ViGEmBus
          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) { exit $proc.ExitCode }
      - name: Install project dependencies
        timeout-minutes: 8
        run: python -m pip install -r requirements.txt
      - name: Run virtual controller tests
        timeout-minutes: 8
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/vgamepad-0.1.0
        run: python -m unittest tests.test_virtual_controller -v
