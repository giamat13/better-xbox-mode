name: Windows virtual controller

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  virtual-controller:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ViGEmBus virtual bus driver
        run: choco install vigembus -y --no-progress
      - name: Install dependencies
        run: python -m pip install -r requirements.txt vgamepad
      - name: Run virtual controller tests
        run: python -m unittest tests.test_virtual_controller -v
