name: Windows virtual controller

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  virtual-controller:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ViGEmBus virtual bus driver
        run: choco install vigembus -y --no-progress
      - name: Check driver service
        shell: cmd
        run: sc query ViGEmBus
      - name: Install vgamepad
        timeout-minutes: 8
        run: python -m pip install --verbose vgamepad
      - name: Install project dependencies
        timeout-minutes: 8
        run: python -m pip install -r requirements.txt
      - name: Run virtual controller tests
        timeout-minutes: 8
        run: python -m unittest tests.test_virtual_controller -v
