name: Windows vJoy virtual joystick

on:
  workflow_dispatch:

jobs:
  vjoy:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download vJoy installer
        shell: pwsh
        run: |
          # Direct SourceForge link for the 2.1.9.1 installer. The 'latest' link returns an HTML page instead.
          Invoke-WebRequest -Uri 'https://sourceforge.net/projects/vjoystick/files/Beta%202.x/2.1.9.1-160719/vJoySetup.exe/download' -OutFile vJoySetup.exe -MaximumRedirection 10
          $size = (Get-Item vJoySetup.exe).Length
          Write-Output "installer bytes: $size"
          if ($size -lt 1000000) { Write-Output 'installer download is too small'; exit 1 }
      - name: Install vJoy
        shell: pwsh
        timeout-minutes: 10
        run: |
          $args1 = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          $p = Start-Process -FilePath "$PWD\vJoySetup.exe" -ArgumentList $args1 -Wait -PassThru
          Write-Output "installer exit (inno-style args): $($p.ExitCode)"
          if (-not (Test-Path 'C:\Program Files\vJoy\x64\vJoyInterface.dll')) {
            $p = Start-Process -FilePath "$PWD\vJoySetup.exe" -ArgumentList @('/S') -Wait -PassThru
            Write-Output "installer exit (/S): $($p.ExitCode)"
          }
          Get-ChildItem 'C:\Program Files\vJoy' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 30 | ForEach-Object { Write-Output $_.FullName }
          if (-not (Test-Path 'C:\Program Files\vJoy\x64\vJoyInterface.dll')) { Write-Output 'vJoyInterface.dll is missing'; exit 1 }
      - name: Install project dependencies
        timeout-minutes: 8
        run: python -m pip install -r requirements.txt
      - name: Run vJoy virtual joystick tests
        timeout-minutes: 8
        shell: pwsh
        run: python -m unittest tests.test_vjoy_controller -v
