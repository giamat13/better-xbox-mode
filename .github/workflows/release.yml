name: release
# Started by hand (workflow_dispatch) on main. The tag vX.Y.Z is created here from package.json.
# Nothing is published unless the tests and both builds passed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    # the same tests as on every push, in parallel with the build
    uses: ./.github/workflows/tests.yml

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read the version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Build the installer and the portable exe
        run: npm run dist
      - name: Check the release files
        shell: bash
        run: |
          # two programs (installer, portable), the installer's blockmap and latest.yml, which the automatic update reads
          EXE=$(ls dist/*.exe 2>/dev/null | wc -l)
          BLOCKMAP=$(ls dist/*.exe.blockmap 2>/dev/null | wc -l)
          if [ "$EXE" -ne 2 ] || [ "$BLOCKMAP" -ne 1 ] || [ ! -f dist/latest.yml ]; then echo "unexpected files in dist"; ls dist; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  publish:
    needs: [tests, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Read the version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Check that the release does not exist yet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION already exists"; exit 1; fi
      - name: Create the tag and the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/*.exe dist/*.exe.blockmap dist/latest.yml --title "$VERSION" --notes-file "docs/release-notes-v$VERSION.md" --target "$GITHUB_SHA"
