<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Xbox mode</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #07090c;
    --glass: rgba(255, 255, 255, 0.055);
    --glass-strong: rgba(255, 255, 255, 0.10);
    --line: rgba(255, 255, 255, 0.10);
    --text: #f4f6f8;
    --muted: rgba(244, 246, 248, 0.55);
    --glow: rgba(255, 255, 255, 0.28);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  body { background:
    radial-gradient(1200px 700px at 78% -10%, rgba(255,255,255,0.09), transparent 60%),
    radial-gradient(900px 600px at 5% 110%, rgba(255,255,255,0.05), transparent 60%), var(--bg); }
  .screen { position: fixed; inset: 0; display: none; padding: 44px 72px 0; }
  body[data-mode="home"] #home, body[data-mode="switcher"] #switcher, body[data-mode="keyboard"] #keyboard { display: block; }
  body[data-mode="keyboard"] { background: transparent; }

  .bar { display: flex; align-items: center; justify-content: space-between; height: 56px; direction: ltr; }
  .brand { letter-spacing: 0.42em; font-size: 15px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
  .status { display: flex; align-items: center; gap: 22px; font-size: 22px; font-weight: 600; }
  .status svg { width: 22px; height: 22px; stroke: var(--text); fill: none; stroke-width: 1.7; opacity: .85; }

  h2 { font-size: 15px; font-weight: 600; letter-spacing: .08em; color: var(--muted); margin: 42px 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px;
    height: calc(100vh - 250px); overflow: hidden; align-content: start; padding: 10px 6px; direction: ltr; }
  .tile { position: relative; height: 150px; border-radius: 18px; background: var(--glass);
    border: 1px solid var(--line); backdrop-filter: blur(20px); display: flex; flex-direction: column;
    justify-content: flex-end; padding: 18px 20px; transition: transform .16s ease, box-shadow .16s ease, background .16s ease; overflow: hidden; }
  .tile .mark { position: absolute; top: 14px; inset-inline-end: 18px; font-size: 74px; font-weight: 700; line-height: 1;
    color: rgba(255,255,255,0.07); }
  .tile .name { font-size: 19px; font-weight: 600; z-index: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.focus { transform: scale(1.06); background: var(--glass-strong); border-color: #fff;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.9), 0 18px 60px var(--glow); z-index: 2; }

  .hints { position: fixed; bottom: 0; inset-inline: 0; height: 74px; display: flex; gap: 34px; align-items: center;
    padding: 0 72px; border-top: 1px solid var(--line); background: rgba(0,0,0,0.35); backdrop-filter: blur(14px); font-size: 16px; }
  .hint { display: flex; align-items: center; gap: 10px; color: var(--text); }
  .glyph { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--text); display: inline-flex;
    align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }

  /* switcher */
  .apps { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 26px; direction: ltr; }
  .apps .pill { width: 54px; height: 54px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; color: var(--muted); }
  .apps .pill.focus { background: var(--glass-strong); border-color: #fff; color: #fff; }
  .apps .key { font-size: 13px; font-weight: 700; color: var(--muted); padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .stage { position: absolute; top: 190px; inset-inline: 0; display: flex; justify-content: center; align-items: center; gap: 40px; direction: ltr; }
  .card { width: 660px; height: 390px; border-radius: 20px; background: rgba(255,255,255,0.06); border: 1px solid #fff;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.85), 0 30px 90px rgba(255,255,255,0.18); overflow: hidden; display: flex; flex-direction: column; }
  .card .title { padding: 16px 22px; font-size: 20px; font-weight: 600; background: rgba(0,0,0,0.45); direction: auto; }
  .card .body { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 150px; font-weight: 700; color: rgba(255,255,255,0.10); }
  .card.side { width: 300px; height: 300px; border: 1px solid var(--line); box-shadow: none; opacity: .5; }
  .card.side .body { font-size: 80px; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 26px; }
  .dock { position: fixed; bottom: 74px; inset-inline: 0; display: flex; justify-content: center; gap: 40px; color: var(--muted); font-size: 15px; }
  .dock b { color: var(--text); border-bottom: 2px solid #fff; padding-bottom: 4px; }

  /* keyboard */
  #keyboard { padding: 0; }
  .kb { position: fixed; inset: 0; padding: 20px 26px 14px; background: rgba(10, 12, 16, 0.94); border-top: 1px solid var(--line); direction: ltr; }
  .kb .row { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; }
  .key-cap { min-width: 82px; height: 58px; padding: 0 16px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600; }
  .key-cap.wide { min-width: 140px; } .key-cap.space { min-width: 480px; font-size: 15px; letter-spacing: .1em; color: var(--muted); }
  .key-cap.focus { background: #fff; color: #07090c; border-color: #fff; box-shadow: 0 0 30px var(--glow); }
  .kb .legend { text-align: center; color: var(--muted); font-size: 14px; margin-top: 6px; }
</style>
</head>
<body data-mode="none">
<section class="screen" id="home">
  <div class="bar"><div class="status"><span id="clockH"></span></div><div class="brand">Xbox mode</div></div>
  <h2>אפליקציות</h2>
  <div class="grid" id="grid"></div>
  <div class="hints"><span class="hint"><i class="glyph">A</i> פתיחה</span><span class="hint"><i class="glyph">B</i> סגירה</span><span class="hint"><i class="glyph">⌖</i> D-pad ניווט</span></div>
</section>

<section class="screen" id="switcher">
  <div class="bar"><div class="status"><span id="clockS"></span></div><div class="brand">Xbox mode</div></div>
  <div class="apps" id="apps"></div>
  <div class="stage" id="stage"></div>
  <div class="dock"><b>Xbox mode</b><span>שולחן עבודה של Windows</span></div>
  <div class="hints"><span class="hint"><i class="glyph">A</i> בחירה</span><span class="hint"><i class="glyph">X</i> סגירת אפליקציה</span><span class="hint"><i class="glyph">B</i> חזרה</span></div>
</section>

<section class="screen" id="keyboard"><div class="kb" id="kb"></div></section>

<script>
  const body = document.body;
  const view = new URLSearchParams(location.search).get('view');
  document.title = view === 'keyboard' ? 'Xbox mode keyboard' : 'Xbox mode';
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const initial = (s) => esc((s || '?').trim().charAt(0).toUpperCase());
  let last = '';

  function renderHome(s) {
    document.getElementById('clockH').textContent = s.clock;
    const grid = document.getElementById('grid');
    grid.innerHTML = s.apps.map((name, i) =>
      `<div class="tile${i === s.selected ? ' focus' : ''}"><span class="mark">${initial(name)}</span><span class="name" dir="auto">${esc(name)}</span></div>`).join('');
    const focus = grid.querySelector('.focus');
    if (focus) focus.scrollIntoView({ block: 'center', behavior: 'instant' });
  }

  function renderSwitcher(s) {
    document.getElementById('clockS').textContent = s.clock;
    const apps = document.getElementById('apps');
    const stage = document.getElementById('stage');
    if (!s.windows.length) { apps.innerHTML = ''; stage.innerHTML = '<div class="empty">אין חלונות פתוחים</div>'; return; }
    apps.innerHTML = '<span class="key">LB</span>' + s.windows.map((w, i) =>
      `<span class="pill${i === s.selected ? ' focus' : ''}">${initial(w.title)}</span>`).join('') + '<span class="key">RB</span>';
    const prev = s.windows[s.selected - 1], cur = s.windows[s.selected], next = s.windows[s.selected + 1];
    const side = (w) => w ? `<div class="card side"><div class="title" dir="auto">${esc(w.title)}</div><div class="body">${initial(w.title)}</div></div>` : '<div class="card side" style="visibility:hidden"></div>';
    stage.innerHTML = side(prev) + `<div class="card"><div class="title" dir="auto">${esc(cur.title)}</div><div class="body">${initial(cur.title)}</div></div>` + side(next);
  }

  function renderKeyboard(s) {
    document.getElementById('kb').innerHTML = s.rows.map((row, r) =>
      '<div class="row">' + row.map((k, c) => {
        const cls = ['key-cap', k.action === 'space' ? 'space' : (k.action === 'text' ? '' : 'wide'), (r === s.row && c === s.column) ? 'focus' : ''].join(' ');
        return `<div class="${cls}">${esc(k.label)}</div>`;
      }).join('') + '</div>').join('') +
      '<div class="legend">D-pad ניווט · A הקלדה · X מחיקה · START Enter · B / Y סגירה</div>';
  }

  async function tick() {
    try {
      const text = await (await fetch('/state', { cache: 'no-store' })).text();
      if (text !== last) {
        last = text;
        const s = JSON.parse(text);
        body.dataset.mode = (view === 'keyboard') ? (s.mode === 'keyboard' ? 'keyboard' : 'none') : (s.mode === 'keyboard' ? 'none' : s.mode);
        if (s.mode === 'home') renderHome(s);
        if (s.mode === 'switcher') renderSwitcher(s);
        if (s.mode === 'keyboard') renderKeyboard(s);
      }
    } catch (e) { /* the app is not running yet */ }
    setTimeout(tick, 50);
  }
  tick();
</script>
</body>
</html>
